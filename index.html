<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chess Puzzle Trainer</title>
    <link rel="stylesheet" href="./src/styles.css">
  </head>
  <body>
    <main>
      <h1>Chess Puzzle Trainer</h1>
      <p>Total stored puzzles: <strong id="stored-count">0</strong></p>

      <section class="panel" aria-labelledby="import-heading">
        <h2 id="import-heading">Puzzle Import</h2>
        <div class="controls">
          <input type="file" id="puzzle-json-file" accept="application/json">
          <button id="preview-import" type="button">Preview Import</button>
        </div>
        <div class="controls" style="margin-top: 0.75rem">
          <label for="duplicate-strategy">Duplicate handling</label>
          <select id="duplicate-strategy">
            <option value="skip">Skip duplicates</option>
            <option value="replace">Replace existing puzzles</option>
          </select>
          <button id="confirm-import" type="button" disabled>Confirm Import</button>
        </div>
        <div style="margin-top: 0.75rem">
          <label for="import-progress">Import progress</label>
          <progress id="import-progress" value="0" max="1" style="width: 100%"></progress>
          <div id="import-progress-label">0%</div>
        </div>
        <p id="import-summary">Upload a JSON file to begin.</p>
        <div id="import-details"></div>
      </section>

      <section class="panel" aria-labelledby="trainer-heading">
        <h2 id="trainer-heading">Play a Puzzle</h2>
        <div class="stats">
          <span>User rating: <strong id="user-rating">1200</strong></span>
          <span>Puzzle difficulty: <strong id="puzzle-rating">—</strong></span>
        </div>
        <div class="controls">
          <label>Minimum rating <input id="rating-min" type="number" value="0" min="0"></label>
          <label>Maximum rating <input id="rating-max" type="number" value="3000" min="0"></label>
          <button id="load-puzzle" type="button">Load another puzzle</button>
          <label class="file-label">Quick import <input id="import-file" type="file" accept=".json,application/json"></label>
        </div>
        <p id="message" class="message" role="status">Import a puzzle JSON file to begin.</p>
        <div id="board" class="board" aria-label="Chessboard"></div>
        <p id="result" class="result" aria-live="polite"></p>
      </section>
    </main>
    <script type="module" src="./src/js/app.js"></script>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
